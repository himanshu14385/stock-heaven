<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alert • Stock Heaven</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="alert.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="page">
<header class="top-header">
  <div class="brand"><div class="brand-icon"><i class="fa-solid fa-chart-line"></i></div><div><h1>Stock Heaven</h1><p>Simple stock analysis</p></div></div>
  <div class="header-right"><div class="market-badge">NSE / BSE</div><button class="theme-toggle" type="button"><i class="fa-solid fa-moon"></i></button></div>
</header>

<nav class="main-nav">
  <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></a>
  <a href="stuck-stock.html" class="nav-item"><i class="fa-solid fa-lock"></i><span>Stuck Stock</span></a>
  <a href="summary.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Summary</span></a>
  <a href="alert.html" class="nav-item active"><i class="fa-solid fa-bell"></i><span>Alert</span></a>
</nav>

<main class="alert-page">
<section class="alert-card">
  <div class="alert-top">
    <div><div class="alert-title"><i class="fa-solid fa-bell"></i> Alert</div><div class="alert-sub">Current price ≤ your alert price = <b>RED</b></div></div>
    <button class="alert-add-btn" onclick="openAddStock()"><i class="fa-solid fa-plus"></i> Add Stock</button>
  </div>

  <div id="addStockBox" class="add-stock-box hidden">
    <div class="autocomplete">
      <input id="stockSearch" autocomplete="off" placeholder="Type stock name or symbol...">
      <div id="recommendations" class="recommendations"></div>
    </div>
  </div>

  <div class="alert-head"><span>STOCK</span><span>MY ALERT</span><span>MARKET PRICE</span><span></span></div>
  <div id="alertList"></div>
  <div id="alertUpdated" class="alert-updated">Updating prices...</div>
</section>
</main>
</div>
<script src="script.js"></script>
<script src="alert.js"></script>
</body>
</html>
