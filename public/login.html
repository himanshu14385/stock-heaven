<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Stock Heaven</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="auth.css"></head><body><div class="auth-shell"><div class="auth-card"><div class="auth-brand"><div class="auth-logo"><i class="fa-solid fa-chart-line"></i></div><h1>Stock Heaven</h1><p>Smart Stock Analysis</p></div><div class="auth-tabs"><button id="adminTab" class="auth-tab active" type="button">Admin</button><button id="guestTab" class="auth-tab" type="button">Guest</button></div><form id="adminForm"><div class="auth-field"><label>Admin Username</label><input id="adminUser" autocomplete="username" required></div><div class="auth-field"><label>Password</label><input id="adminPass" type="password" autocomplete="current-password" required></div><button class="auth-btn" type="submit">Login as Admin</button></form><form id="guestForm" hidden><div class="auth-field"><label>Guest Username</label><input id="guestUser" autocomplete="username" required></div><div class="auth-field"><label>Password</label><input id="guestPass" type="password" autocomplete="current-password" required></div><button class="auth-btn auth-guest" type="submit"><i class="fa-solid fa-user"></i> Login as Guest</button></form><div id="authError" class="auth-error"></div><p class="auth-info">Guest session automatically expires after 5 minutes.<br>Guest username/password Admin kabhi bhi change kar sakta hai.</p></div></div><script src="auth.js"></script></body></html>
