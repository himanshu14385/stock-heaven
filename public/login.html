<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Login · Stock Heaven</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="auth.css"></head><body><div class="auth-shell"><div class="auth-card"><div class="auth-brand"><div class="auth-logo"><i class="fa-solid fa-chart-line"></i></div><h1>Stock Heaven</h1><p>Smart Stock Analysis</p></div><div class="auth-tabs"><button id="adminTab" class="auth-tab active" type="button">Admin</button><button id="guestTab" class="auth-tab" type="button">Guest</button></div><form id="adminForm" novalidate><div class="auth-field"><label for="adminUser">Admin Username</label><input id="adminUser" autocomplete="username" required></div><div class="auth-field"><label for="adminPass">Password</label><input id="adminPass" type="password" autocomplete="current-password" required></div><button id="adminSubmit" class="auth-btn" type="submit">Login as Admin</button></form><form id="guestForm" hidden novalidate><div class="auth-field"><label for="guestUser">Guest Username</label><input id="guestUser" autocomplete="username" required></div><div class="auth-field"><label for="guestPass">Password</label><input id="guestPass" type="password" autocomplete="current-password" required></div><button id="guestSubmit" class="auth-btn auth-guest" type="submit"><i class="fa-solid fa-user"></i> Login as Guest</button></form><div id="authError" class="auth-error" role="alert" aria-live="polite"></div><p class="auth-info">Guest session automatically expires after 5 minutes.<br>Guest username/password Admin kabhi bhi change kar sakta hai.</p></div></div><script>
(()=>{const a=document.getElementById('adminTab'),g=document.getElementById('guestTab'),af=document.getElementById('adminForm'),gf=document.getElementById('guestForm'),e=document.getElementById('authError'),as=document.getElementById('adminSubmit'),gs=document.getElementById('guestSubmit');let busy=false;const show=x=>{a.classList.toggle('active',x==='admin');g.classList.toggle('active',x==='guest');af.hidden=x!=='admin';gf.hidden=x!=='guest';e.textContent=''};a.onclick=()=>show('admin');g.onclick=()=>show('guest');async function login(role,uid,pid,b){if(busy)return;const username=document.getElementById(uid).value.trim(),password=document.getElementById(pid).value;if(!username||!password){e.textContent='Username aur password required hai.';return}busy=true;b.disabled=true;e.textContent='Checking...';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,username,password})});let d=null;try{d=await r.json()}catch(_){}if(!r.ok){e.textContent=r.status===401?'Invalid username ya password.':(d&&d.error)||'Server error. Dobara try karein.';return}if(!d||!d.ok){e.textContent='Login response invalid hai. Dobara try karein.';return}location.replace('/index.html')}catch(_){e.textContent='Server se connection nahi ho pa raha. Dobara try karein.'}finally{busy=false;b.disabled=false}}af.onsubmit=x=>{x.preventDefault();login('admin','adminUser','adminPass',as)};gf.onsubmit=x=>{x.preventDefault();login('guest','guestUser','guestPass',gs)}})();
</script></body></html>
